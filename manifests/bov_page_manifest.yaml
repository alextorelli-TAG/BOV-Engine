  - {p: 12, id: mm_multifamily_rank,   class: annual,  section: INVESTMENT OVERVIEW, notes: "Property-type specific. Swap for Office/Retail/Mixed-Use variants."}
  - {p: 13, id: mm_website,            class: static,  section: INVESTMENT OVERVIEW}
