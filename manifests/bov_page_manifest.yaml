# Preset section bundles — what the operator actually chooses between
presets:
  full:      [1,2,3,4, 5..18, 19,20, 21,22,23, 24..29, 30,31,32, 33..38, 39..45, 46..52, 53]
  lean:      [1,2,3,4, 5,8,10,11,12, 19,20, 21,22, 24,25,26,27,29, 30,31, 33,34,35,37, 39,40,41,44, 46,47, 53]
  repeat_client: [1,2,3,4, 19,20, 24,25,26,27,29, 30,31,32, 33,34,35,37,38, 39,40,41,44,45, 46,47,48, 53]
  # repeat_client drops the whole MM corporate pitch (pp 5-18) — they've seen it.
