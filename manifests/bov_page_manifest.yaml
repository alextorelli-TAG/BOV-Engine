# TAG BOV — Page Manifest
# Source: YE_2025_BOV_Template_4_30_26 (53pp, 792x612pt landscape)
#
# class:
#   static    — byte-identical passthrough from library. Never generated. 21pp
#   annual    — passthrough; corporate refreshes stats once a year. 3pp
#   variant   — pick 1 from a pre-built set (agent / metro). Never generated. 6pp
#   stamp     — corporate page passthrough + image dropped into a frame. 14pp
#   build     — genuine HTML->PDF page template. 9pp
#
# Only `build` pages require layout work. Only 7 distinct templates cover them.

meta:
  page_size: [792, 612]      # pt, landscape 11x8.5
  fonts:
    display: Frank Ruhl Libre   # Google Fonts - free, exact corporate match
    ui: Roboto                  # Google Fonts - free
    # MinionPro appears in a hidden legacy footer layer only. Ignore it.
  colors:
    navy:   "#002B5C"
    orange: "#E5893F"
    grey:   "#E7E9EB"
    ink:    "#333333"
  footer_band:                  # flat grey, no art beneath -> safe to white-box + restamp
    rect: [0, 16.9, 233, 33.2]  # x0, y0, x1, y1 in PDF coords (origin bottom-left)
    format: "{page} | {section}"
    font: [Frank Ruhl Libre Medium, 9.0]

pages:
  - {p: 1,  id: cover,                 class: build,   section: null,               notes: "Property name + address over hero photo. Text sits on image - must rebuild, cannot white-box."}
  - {p: 2,  id: disclaimer,            class: static,  section: null,               notes: "Activity ID is the only variable; stamp it."}
  - {p: 3,  id: presented_by_front,    class: variant, section: null,               notes: "One prebuilt per advisor (Anton / Kessler / team)."}
  - {p: 4,  id: toc,                   class: build,   section: null,               notes: "MUST generate last - contents depend on which sections survived selection."}

  - {p: 5,  id: div_s1_mm_advantage,   class: static,  section: null}
  - {p: 6,  id: mm_welcome_1971,       class: static,  section: INVESTMENT OVERVIEW}
  - {p: 7,  id: mm_mission,            class: static,  section: INVESTMENT OVERVIEW}
  - {p: 8,  id: mm_advantage,          class: static,  section: INVESTMENT OVERVIEW}
  - {p: 9,  id: mm_specialists,        class: static,  section: INVESTMENT OVERVIEW}
  - {p: 10, id: mm_track_record,       class: annual,  section: INVESTMENT OVERVIEW, notes: "TTM brokerage rankings."}
